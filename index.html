<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allocate</title>
  <style>
    :root{
      --bg1:#ff7aa2;
      --bg2:#ffb36a;
      --card:#ffffffcc;
      --ink:#1b1020;
      --muted:#5b4b61;
      --stroke:#ffffff66;
      --accent:#ff5f9a;
      --accent2:#ff9a5a;
      --shadow: 0 20px 55px rgba(25, 10, 30, .18);
      --shadow2: 0 10px 24px rgba(25, 10, 30, .12);
      --radius: 24px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(255,255,255,.35), transparent 55%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:22px 14px 40px;
    }

    .phone{
      width:min(420px, 100%);
      border-radius: 36px;
      padding: 16px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding-bottom: 92px;
      position: relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 6px 6px 14px;
    }
    .brand{
      font-weight:800;
      letter-spacing:.2px;
      font-size:18px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 14px rgba(255,95,154,.35);
    }

    .pillbtn{
      border:1px solid rgba(255,255,255,.55);
      background: rgba(255,255,255,.28);
      color: var(--ink);
      padding: 10px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:700;
      box-shadow: var(--shadow2);
      transition: transform .08s ease;
      user-select:none;
    }
    .pillbtn:active{ transform: translateY(1px) scale(.99); }

    .card{
      background: var(--card);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow2);
    }
    .stack{ display:flex; flex-direction:column; gap:12px; }

    .hero{
      text-align:center;
      padding: 18px 16px 14px;
    }
    .hero .label{
      font-weight:800;
      font-size:18px;
      margin: 0 0 6px 0;
    }
    .big{
      font-weight:900;
      font-size:64px;
      line-height:1;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      letter-spacing: -1.5px;
    }

    .kpis{
      display:flex;
      gap:10px;
      margin-top: 14px;
      justify-content:center;
      flex-wrap:nowrap;
      align-items:stretch;
    }
    .kpi{
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 18px;
      padding: 10px 12px;
      width: calc(50% - 5px);
      text-align:left;
      min-width: 0;
    }
    .kpi .klabel{ font-size:12px; color:var(--muted); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .kpi .kval{ font-size:18px; font-weight:900; margin-top: 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .row{
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex-wrap:nowrap;
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      margin: 0 0 6px 2px;
    }
    input{
      width:100%;
      border:1px solid rgba(255,255,255,.8);
      background: rgba(255,255,255,.8);
      border-radius: 16px;
      padding: 12px 12px;
      font-size: 16px;
      font-weight:800;
      outline:none;
    }
    input:focus{
      border-color: rgba(255,95,154,.55);
      box-shadow: 0 0 0 4px rgba(255,95,154,.18);
    }

    .field{ flex: 1 1 0; min-width: 0; }
    .field.small{ flex: 0 0 120px; }

    .toggle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.6);
      border: 1px solid rgba(255,255,255,.75);
      min-height: 50px;
      flex: 1 1 0;
      min-width: 0;
    }
    .toggle span{
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
    }

    .iosSwitch{
      position: relative;
      width: 52px;
      height: 32px;
      flex: 0 0 auto;
    }
    .iosSwitch input{
      opacity:0;
      width:0;
      height:0;
      position:absolute;
    }
    .slider{
      position:absolute;
      cursor:pointer;
      inset:0;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 999px;
      transition: .18s;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
    }
    .slider:before{
      content:"";
      position:absolute;
      height: 28px;
      width: 28px;
      left: 1px;
      top: 1px;
      background: #fff;
      border-radius: 999px;
      transition: .18s;
      box-shadow: 0 8px 16px rgba(25,10,30,.18);
    }
    .iosSwitch input:checked + .slider{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: rgba(255,255,255,.55);
    }
    .iosSwitch input:checked + .slider:before{
      transform: translateX(20px);
    }

    .btn{
      width:100%;
      border:0;
      cursor:pointer;
      border-radius: 18px;
      padding: 14px 14px;
      font-weight:900;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 30px rgba(255,95,154,.30);
      transition: transform .08s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px) scale(.995); }
    .btn.ghost{
      background: rgba(255,255,255,.35);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: var(--shadow2);
    }

    .mini{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top: 6px;
    }
    .mini .hint{
      font-size:12px;
      color: var(--muted);
      font-weight:800;
    }

    .logWrap{
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 18px;
    }
    table.log{
      width:100%;
      border-collapse: collapse;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 18px;
      overflow:hidden;
      table-layout: fixed;
      min-width: 360px;
    }
    .log th, .log td{
      text-align:left;
      padding: 10px 10px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.55);
      vertical-align: top;
      white-space: nowrap;
    }
    .log th{
      font-size: 12px;
      color: var(--muted);
      font-weight:900;
      letter-spacing:.2px;
      background: rgba(255,255,255,.45);
    }
    .log tr:last-child td{ border-bottom:0; }
    .right{ text-align:right; }

    .del{
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.55);
      color: var(--ink);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }
    .del:active{ transform: translateY(1px) scale(.99); }

    .spacer{ height: 8px; }

    .page{ display:none; margin-top: 12px; }
    .page.active{ display:block; }

    .tabbar{
      position:absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: rgba(255,255,255,.28);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 22px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      padding: 10px 10px;
      display:flex;
      gap: 8px;
      justify-content:space-between;
      align-items:center;
    }
    .tabbtn{
      flex: 1 1 0;
      border: 0;
      background: transparent;
      color: rgba(27,16,32,.65);
      border-radius: 16px;
      padding: 10px 0;
      cursor:pointer;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      user-select:none;
    }
    .tabbtn.active{
      background: rgba(255,255,255,.48);
      color: var(--ink);
      box-shadow: 0 8px 16px rgba(25,10,30,.10);
    }
    .icon{
      width: 22px;
      height: 22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
      line-height: 1;
    }
    .coming{
      text-align:center;
      font-weight:900;
      color: rgba(27,16,32,.60);
      padding: 22px 10px;
    }

    @media (max-width: 380px){
      .field.small{ flex: 0 0 110px; }
      .big{ font-size: 58px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Allocate</div>
      <button class="pillbtn" id="exportBtn">Export</button>
    </div>

    <!-- DASHBOARD -->
    <div class="page active" id="pageDash">
      <div class="stack">
        <div class="card hero">
          <div class="label">Today's budget</div>
          <p class="big" id="budgetBig">0</p>

          <div class="kpis">
            <div class="kpi">
              <div class="klabel">Burned yesterday</div>
              <div class="kval" id="yTdeeKpi">0</div>
            </div>
            <div class="kpi">
              <div class="klabel">Deficit</div>
              <div class="kval" id="deficitKpi">0</div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="row">
            <div class="field">
              <label for="tdeeInput">Yesterday's TDEE</label>
              <input id="tdeeInput" type="number" inputmode="numeric" min="0" placeholder="Enter TDEE" />
            </div>

            <div class="toggle">
              <span>Maintenance</span>
              <label class="iosSwitch" aria-label="Maintenance day">
                <input id="maintenanceToggle" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="spacer"></div>
          <button class="btn" id="applyBtn">Apply</button>

          <div class="mini">
            <div class="hint" id="modeHint"></div>
            <div class="hint" id="savedHint"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="page" id="pageSettings">
      <div class="stack">
        <div class="card">
          <div class="row">
            <div class="field">
              <label for="deficitInput">Daily deficit</label>
              <input id="deficitInput" type="number" inputmode="numeric" min="0" />
            </div>
            <div class="field small">
              <button class="btn ghost" id="saveDeficitBtn">Save</button>
            </div>
          </div>
          <div class="mini">
            <div class="hint"></div>
            <div class="hint" id="deficitSavedHint"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- LOGGING -->
    <div class="page" id="pageLogging">
      <div class="stack">
        <div class="card hero">
          <div class="label">Calories left today</div>
          <p class="big" id="leftBig">0</p>

          <div class="kpis" style="justify-content:space-between">
            <div class="kpi">
              <div class="klabel">Today's running intake</div>
              <div class="kval" id="intakeKpi">0</div>
            </div>
            <div class="kpi">
              <div class="klabel">Remaining</div>
              <div class="kval" id="remainKpi">0</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <div class="field">
              <label for="addInput">Log calories</label>
              <input id="addInput" type="number" inputmode="numeric" min="0" />
            </div>
            <div class="field small">
              <button class="btn" id="addBtn">Add</button>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="row">
            <div class="field">
              <button class="btn ghost" id="undoBtn">Undo last add</button>
            </div>
            <div class="field">
              <button class="btn" id="endDayBtn">End day</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- INFO HUB (lightning after swap) -->
    <div class="page" id="pageInfo">
      <div class="card coming">Coming soon</div>
    </div>

    <!-- PROGRESS (book after swap) -->
    <div class="page" id="pageProgress">
      <div class="stack">
        <div class="card">
          <div class="logWrap">
            <table class="log" id="logTable">
              <thead>
                <tr>
                  <th class="right">TDEE</th>
                  <th class="right">Budget</th>
                  <th class="right">Intake</th>
                  <th class="right">Deficit</th>
                  <th class="right"></th>
                </tr>
              </thead>
              <tbody id="logBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB BAR -->
    <div class="tabbar">
      <button class="tabbtn active" data-go="dash" aria-label="Dashboard"><span class="icon">✨</span></button>
      <button class="tabbtn" data-go="settings" aria-label="Settings"><span class="icon">⚙️</span></button>
      <button class="tabbtn" data-go="logging" aria-label="Logging"><span class="icon">＋</span></button>
      <button class="tabbtn" data-go="progress" aria-label="Progress"><span class="icon">📖</span></button>
      <button class="tabbtn" data-go="info" aria-label="Info hub"><span class="icon">⚡</span></button>
    </div>
  </div>

  <script>
    const ROLLOVER_HOUR = 3;

    const LS_STATE = "allocate_today_state_v3";
    const LS_LOG = "allocate_log_v3";
    const LS_DEFICIT = "allocate_deficit_v1";

    const el = (id) => document.getElementById(id);

    const fmt = (n) => {
      const x = Number.isFinite(n) ? Math.round(n) : 0;
      return x.toLocaleString("en-GB");
    };

    const effectiveNow = () => {
      const d = new Date();
      if(d.getHours() < ROLLOVER_HOUR){
        d.setDate(d.getDate() - 1);
      }
      return d;
    };

    const todayISO = () => {
      const d = effectiveNow();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    };

    const isoWeekKey = (date = effectiveNow()) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      const year = d.getUTCFullYear();
      return `${year}-W${String(weekNo).padStart(2, "0")}`;
    };

    const loadJSON = (key, fallback) => {
      try{
        const raw = localStorage.getItem(key);
        if(!raw) return fallback;
        return JSON.parse(raw);
      }catch{
        return fallback;
      }
    };

    const saveJSON = (key, value) => {
      localStorage.setItem(key, JSON.stringify(value));
    };

    const getDeficit = () => {
      const v = Number(localStorage.getItem(LS_DEFICIT));
      if(Number.isFinite(v) && v >= 0) return Math.round(v);
      return 750;
    };

    const setDeficit = (v) => {
      localStorage.setItem(LS_DEFICIT, String(Math.max(0, Math.round(v))));
    };

    const defaultState = () => ({
      date: todayISO(),
      yTdee: 0,
      maintenance: false,
      budget: 0,
      intake: 0,
      lastAdd: 0
    });

    let state = loadJSON(LS_STATE, null);
    if(!state || !state.date){
      state = defaultState();
      saveJSON(LS_STATE, state);
    }
    if(state.date !== todayISO()){
      state = defaultState();
      saveJSON(LS_STATE, state);
    }

    const getLog = () => loadJSON(LS_LOG, []);
    const setLog = (arr) => saveJSON(LS_LOG, arr);

    const calcBudget = () => {
      const t = Math.max(0, Number(state.yTdee || 0));
      const deficit = getDeficit();
      if(state.maintenance) return t;
      return Math.max(0, t - deficit);
    };

    const calcLeft = () => Math.round(calcBudget() - Number(state.intake || 0));

    const render = () => {
      state.budget = calcBudget();

      el("tdeeInput").value = state.yTdee ? String(state.yTdee) : "";
      el("maintenanceToggle").checked = !!state.maintenance;

      const deficit = getDeficit();
      el("yTdeeKpi").textContent = fmt(state.yTdee || 0);
      el("deficitKpi").textContent = `-${fmt(deficit)}`;

      el("budgetBig").textContent = fmt(state.budget || 0);

      const left = calcLeft();
      el("leftBig").textContent = fmt(left);
      el("intakeKpi").textContent = fmt(state.intake || 0);
      el("remainKpi").textContent = fmt(left);

      el("modeHint").textContent = state.maintenance ? "Maintenance" : "Deficit";
      el("savedHint").textContent = "Saved";

      el("deficitInput").value = String(getDeficit());
      saveJSON(LS_STATE, state);

      renderLog();
    };

    const renderLog = () => {
      const log = getLog().slice().sort((a,b) => (a.date < b.date ? 1 : -1));
      const body = el("logBody");
      body.innerHTML = "";

      for(const entry of log){
        const tr = document.createElement("tr");
        const deficit = Math.max(0, Math.round((entry.yTdee || 0) - (entry.budget || 0)));
        tr.innerHTML = `
          <td class="right">${fmt(entry.yTdee || 0)}</td>
          <td class="right">${fmt(entry.budget || 0)}</td>
          <td class="right">${fmt(entry.intake || 0)}</td>
          <td class="right">${fmt(deficit)}</td>
          <td class="right"><button class="del" data-del="${entry.id}">Delete</button></td>
        `;
        body.appendChild(tr);
      }

      body.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del");
          const next = getLog().filter(x => String(x.id) !== String(id));
          setLog(next);
          renderLog();
        });
      });
    };

    el("applyBtn").addEventListener("click", () => {
      const v = Number(el("tdeeInput").value || 0);
      state.yTdee = Number.isFinite(v) ? Math.round(v) : 0;
      render();
    });

    el("maintenanceToggle").addEventListener("change", () => {
      state.maintenance = !!el("maintenanceToggle").checked;
      render();
    });

    el("addBtn").addEventListener("click", () => {
      const v = Number(el("addInput").value || 0);
      if(!Number.isFinite(v) || v <= 0) return;
      state.intake = Math.max(0, Math.round(Number(state.intake || 0) + v));
      state.lastAdd = Math.round(v);
      el("addInput").value = "";
      render();
    });

    el("addInput").addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        el("addBtn").click();
      }
    });

    el("undoBtn").addEventListener("click", () => {
      const v = Math.round(Number(state.lastAdd || 0));
      if(!Number.isFinite(v) || v <= 0) return;
      state.intake = Math.max(0, Math.round(Number(state.intake || 0) - v));
      state.lastAdd = 0;
      render();
    });

    el("endDayBtn").addEventListener("click", () => {
      state.budget = calcBudget();

      const entry = {
        id: `${state.date}_${Date.now()}`,
        date: state.date,
        yTdee: Math.round(state.yTdee || 0),
        maintenance: !!state.maintenance,
        budget: Math.round(state.budget || 0),
        intake: Math.round(state.intake || 0),
        weekKey: isoWeekKey(effectiveNow())
      };

      const log = getLog();
      const existingIdx = log.findIndex(x => x.date === entry.date);
      if(existingIdx >= 0){
        log[existingIdx] = entry;
      }else{
        log.push(entry);
      }
      setLog(log);

      state = defaultState();
      saveJSON(LS_STATE, state);
      render();
    });

    el("saveDeficitBtn").addEventListener("click", () => {
      const v = Number(el("deficitInput").value || 0);
      if(!Number.isFinite(v) || v < 0) return;
      setDeficit(v);
      el("deficitSavedHint").textContent = "Saved";
      render();
      setTimeout(() => { el("deficitSavedHint").textContent = ""; }, 900);
    });

    el("exportBtn").addEventListener("click", () => {
      const payload = {
        exportedAt: new Date().toISOString(),
        deficit: getDeficit(),
        log: getLog()
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `allocate_export_${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    const showPage = (name) => {
      const map = {
        dash: "pageDash",
        settings: "pageSettings",
        logging: "pageLogging",
        info: "pageInfo",
        progress: "pageProgress"
      };

      Object.values(map).forEach((id) => el(id).classList.remove("active"));
      el(map[name]).classList.add("active");

      document.querySelectorAll(".tabbtn").forEach((b) => b.classList.remove("active"));
      document.querySelector(`.tabbtn[data-go="${name}"]`).classList.add("active");
    };

    document.querySelectorAll(".tabbtn").forEach((b) => {
      b.addEventListener("click", () => showPage(b.getAttribute("data-go")));
    });

    render();
  </script>
</body>
</html>
