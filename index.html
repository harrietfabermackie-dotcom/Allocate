<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allocate</title>
  <meta name="theme-color" content="#ff7aa2" />
  <style>
    :root{
      --bg1:#ff7aa2;
      --bg2:#ffb36a;
      --card:#ffffffcc;
      --ink:#1b1020;
      --muted:#5b4b61;
      --accent:#ff5f9a;
      --accent2:#ff9a5a;
      --shadow: 0 20px 55px rgba(25, 10, 30, .18);
      --shadow2: 0 10px 24px rgba(25, 10, 30, .12);
      --radius: 24px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(255,255,255,.35), transparent 55%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:22px 14px 40px;
    }

    .phone{
      width:min(420px, 100%);
      border-radius: 36px;
      padding: 16px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 6px 6px 12px;
    }
    .brand{
      font-weight:900;
      letter-spacing:.2px;
      font-size:18px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 14px rgba(255,95,154,.35);
    }
    .pillbtn{
      border:1px solid rgba(255,255,255,.55);
      background: rgba(255,255,255,.28);
      color: var(--ink);
      padding: 10px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:900;
      box-shadow: var(--shadow2);
      transition: transform .08s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .pillbtn:active{ transform: translateY(1px) scale(.99); }

    .card{
      background: var(--card);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow2);
    }
    .stack{ display:flex; flex-direction:column; gap:12px; }

    .hero{
      text-align:center;
      padding: 18px 16px 14px;
    }
    .hero .label{
      font-weight:900;
      font-size:18px;
      margin: 0 0 6px 0;
    }
    .big{
      font-weight:900;
      font-size:64px;
      line-height:1;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      letter-spacing: -1.5px;
    }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width: 360px){
      .grid2{ grid-template-columns: 1fr; }
    }

    .kpi{
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 18px;
      padding: 10px 12px;
      text-align:left;
      min-width: 0;
    }
    .kpi .klabel{ font-size:12px; color:var(--muted); font-weight:900; display:flex; align-items:center; gap:8px; }
    .kpi .kval{ font-size:18px; font-weight:900; margin-top: 2px; }

    .kpiTopRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex-wrap:wrap;
    }
    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      margin: 0 0 6px 2px;
    }
    input, select{
      width:100%;
      border:1px solid rgba(255,255,255,.8);
      background: rgba(255,255,255,.8);
      border-radius: 16px;
      padding: 12px 12px;
      font-size: 16px;
      font-weight:900;
      outline:none;
      color: var(--ink);
    }
    input::placeholder{ color: rgba(91,75,97,.65); font-weight:800; }
    input:focus, select:focus{
      border-color: rgba(255,95,154,.55);
      box-shadow: 0 0 0 4px rgba(255,95,154,.18);
    }

    .field{ flex: 1 1 170px; min-width: 0; }
    .field.small{ flex: 0 0 120px; }

    .btn{
      width:100%;
      border:0;
      cursor:pointer;
      border-radius: 18px;
      padding: 14px 14px;
      font-weight:900;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 30px rgba(255,95,154,.30);
      transition: transform .08s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px) scale(.995); }
    .btn.ghost{
      background: rgba(255,255,255,.35);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: var(--shadow2);
    }
    .btn.saved{
      background: rgba(255,255,255,.55);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: var(--shadow2);
    }

    .mini{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top: 8px;
    }
    .mini .hint{
      font-size:12px;
      color: var(--muted);
      font-weight:900;
    }

    .spacer{ height: 8px; }

    .switchRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 12px;
      border-radius: 18px;
      background: rgba(255,255,255,.6);
      border: 1px solid rgba(255,255,255,.75);
      min-height: 50px;
      flex: 1 1 190px;
      min-width: 0;
    }
    .switchRow .slabel{
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .iosSwitch{
      position:relative;
      width: 52px;
      height: 32px;
      flex: 0 0 52px;
    }
    .iosSwitch input{
      position:absolute;
      inset:0;
      opacity:0;
      margin:0;
      width:100%;
      height:100%;
    }
    .iosTrack{
      position:absolute;
      inset:0;
      border-radius: 999px;
      background: rgba(91,75,97,.18);
      border: 1px solid rgba(255,255,255,.65);
      transition: background .15s ease;
    }
    .iosThumb{
      position:absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 8px 18px rgba(25, 10, 30, .18);
      transition: transform .15s ease;
    }
    .iosSwitch input:checked + .iosTrack{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: rgba(255,255,255,.65);
    }
    .iosSwitch input:checked ~ .iosThumb{
      transform: translateX(20px);
    }

    .bottomTabsWrap{
      margin-top: 12px;
      padding: 10px 10px;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 20px;
      box-shadow: var(--shadow2);
    }
    .bottomTabs{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:8px;
      align-items:center;
    }
    .btab{
      border:1px solid transparent;
      background: transparent;
      border-radius: 16px;
      padding: 10px 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      color: rgba(27,16,32,.75);
      min-width: 0;
    }
    .btab .ico{
      font-size:18px;
      line-height: 1;
    }
    .btab.active{
      background: rgba(255,255,255,.45);
      border-color: rgba(255,255,255,.65);
      box-shadow: 0 10px 22px rgba(25,10,30,.10);
      color: var(--ink);
    }

    .page{ display:none; margin-top:12px; }
    .page.active{ display:block; }

    .entryList{
      margin: 10px 0 0 0;
      padding: 0;
      list-style: none;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .entry{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.72);
      min-width: 0;
    }
    .entry .left{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 0;
    }
    .entry .time{
      font-size:12px;
      color: var(--muted);
      font-weight:900;
    }
    .entry .cals{
      font-size:16px;
      font-weight:900;
    }
    .xbtn{
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.55);
      color: var(--ink);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      flex: 0 0 auto;
    }
    .xbtn:active{ transform: translateY(1px) scale(.99); }

    .smBtn{
      border:1px solid rgba(255,255,255,.65);
      background: rgba(255,255,255,.35);
      color: var(--ink);
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:900;
      box-shadow: var(--shadow2);
      -webkit-tap-highlight-color: transparent;
      flex: 0 0 auto;
    }
    .smBtn:active{ transform: translateY(1px) scale(.99); }

    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(25,10,30,.25);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 50;
    }
    .modalBack.show{ display:flex; }
    .modal{
      width:min(420px, 100%);
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: var(--shadow);
      padding: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .modalTop .mtitle{
      font-weight:900;
      font-size:16px;
    }
    .closeBtn{
      border: 1px solid rgba(255,255,255,.75);
      background: rgba(255,255,255,.55);
      border-radius: 999px;
      padding: 8px 10px;
      font-weight:900;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .closeBtn:active{ transform: translateY(1px) scale(.99); }

    .note{
      font-size:12px;
      color: rgba(91,75,97,.8);
      font-weight:900;
      margin-top: 6px;
    }

    .statsHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .statsTitle{
      font-weight:900;
      font-size:14px;
      color: rgba(27,16,32,.85);
    }
    .pencil{
      width: 36px;
      height: 36px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.65);
      background: rgba(255,255,255,.35);
      box-shadow: var(--shadow2);
      cursor:pointer;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-tap-highlight-color: transparent;
    }
    .pencil:active{ transform: translateY(1px) scale(.99); }

    .kvRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .kv{
      flex: 1 1 45%;
      min-width: 150px;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 16px;
      padding: 10px 12px;
    }
    .kv .k{ font-size:12px; color: var(--muted); font-weight:900; }
    .kv .v{ font-size:14px; font-weight:900; margin-top: 2px; }

    .inlineUse{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .useBtn{
      border:1px solid rgba(255,255,255,.65);
      background: rgba(255,255,255,.35);
      color: var(--ink);
      padding: 6px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:900;
      box-shadow: var(--shadow2);
      -webkit-tap-highlight-color: transparent;
      font-size: 12px;
      line-height: 1;
      flex: 0 0 auto;
    }
    .useBtn:active{ transform: translateY(1px) scale(.99); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Allocate</div>
      <button class="pillbtn" id="exportBtn">Export</button>
    </div>

    <!-- DASHBOARD -->
    <div class="page active" id="pageDash">
      <div class="stack">
        <div class="card hero">
          <div class="label">Today's budget</div>
          <p class="big" id="budgetBig">0</p>

          <div class="spacer"></div>

          <div class="grid2">
            <div class="kpi">
              <div class="klabel">Burned yesterday</div>
              <div class="kval" id="yTdeeKpi">0</div>
            </div>
            <div class="kpi">
              <div class="klabel">Deficit</div>
              <div class="kval" id="deficitKpi">-0</div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="grid2">
            <div class="kpi">
              <div class="klabel">Rollover calories</div>
              <div class="kval" id="rolloverKpi">0</div>
            </div>
            <div class="kpi">
              <div class="klabel kpiTopRow">
                <span>Banked calories</span>
                <span class="inlineUse">
                  <button class="useBtn" id="useBankedBtn">USE</button>
                </span>
              </div>
              <div class="kval" id="bankedKpi">0</div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="row">
            <div class="field">
              <label for="tdeeInputDash">Yesterday's TDEE</label>
              <input id="tdeeInputDash" type="number" inputmode="numeric" min="0" placeholder="Enter TDEE" />
            </div>

            <div class="field">
              <div class="switchRow">
                <div class="slabel">Maintenance</div>
                <div class="iosSwitch" aria-label="Maintenance">
                  <input id="maintenanceToggleDash" type="checkbox" />
                  <span class="iosTrack"></span>
                  <span class="iosThumb"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="spacer"></div>
          <button class="btn" id="applyDashBtn">Apply</button>

          <div class="mini">
            <div class="hint" id="modeHint"></div>
            <div class="hint" id="savedHint"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="page" id="pageSettings">
      <div class="stack">
        <div class="card">
          <div class="field">
            <label for="deficitInput">Deficit</label>
            <input id="deficitInput" type="number" inputmode="numeric" min="0" placeholder="750" />
          </div>
          <div class="spacer"></div>
          <button class="btn" id="saveSettingsBtn">Save</button>
        </div>

        <div class="card" id="statsCard">
          <div class="statsHeader">
            <div class="statsTitle">My stats</div>
            <button class="pencil" id="editStatsBtn" aria-label="Edit stats">✎</button>
          </div>

          <div id="statsView">
            <div class="kvRow">
              <div class="kv"><div class="k">Height</div><div class="v" id="svHeight">-</div></div>
              <div class="kv"><div class="k">Weight</div><div class="v" id="svWeight">-</div></div>
              <div class="kv"><div class="k">Age</div><div class="v" id="svAge">-</div></div>
              <div class="kv"><div class="k">Gender</div><div class="v" id="svGender">-</div></div>
            </div>
          </div>

          <div id="statsEdit" style="display:none;">
            <div class="row">
              <div class="field">
                <label for="heightInput">Height (cm)</label>
                <input id="heightInput" type="number" inputmode="numeric" min="0" />
              </div>
              <div class="field">
                <label for="weightStatInput">Weight (lb)</label>
                <input id="weightStatInput" type="number" inputmode="decimal" step="0.1" min="0" />
              </div>
            </div>
            <div class="spacer"></div>
            <div class="row">
              <div class="field">
                <label for="ageInput">Age</label>
                <input id="ageInput" type="number" inputmode="numeric" min="0" />
              </div>
              <div class="field">
                <label for="genderInput">Gender</label>
                <select id="genderInput">
                  <option value="">Select</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                  <option value="other">Other</option>
                  <option value="na">Prefer not to say</option>
                </select>
              </div>
            </div>
            <div class="spacer"></div>
            <button class="btn ghost" id="applyStatsBtn">Apply</button>
          </div>

          <div class="note" id="statsSavedHint" style="display:none;">Saved</div>
        </div>
      </div>
    </div>

    <!-- LOGGING -->
    <div class="page" id="pageLogging">
      <div class="stack">
        <div class="card hero">
          <div class="label">Calories left today</div>
          <p class="big" id="leftBig">0</p>

          <div class="spacer"></div>

          <div class="grid2">
            <div class="kpi">
              <div class="klabel">Running intake</div>
              <div class="kval" id="intakeKpi">0</div>
            </div>
            <div class="kpi">
              <div class="klabel">Budget</div>
              <div class="kval" id="budgetLogKpi">0</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <div class="field">
              <label for="addInput">Log calories</label>
              <input id="addInput" type="number" inputmode="numeric" min="0" />
            </div>
            <div class="field small">
              <button class="btn" id="addBtn">Add</button>
            </div>
          </div>

          <ul class="entryList" id="entryList"></ul>

          <div class="spacer"></div>

          <div class="grid2">
            <button class="btn ghost" id="undoBtn">Undo last add</button>
            <button class="btn" id="endDayBtn">End day</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="page" id="pageProgress">
      <div class="stack" id="progressStack"></div>
    </div>

    <!-- INFO HUB -->
    <div class="page" id="pageInfo">
      <div class="stack">
        <div class="card">
          <div style="font-weight:900; font-size:16px;">Coming soon</div>
        </div>
      </div>
    </div>

    <!-- Bottom tabs -->
    <div class="bottomTabsWrap">
      <div class="bottomTabs">
        <button class="btab active" data-page="Dash" aria-label="Dashboard"><span class="ico">✨</span></button>
        <button class="btab" data-page="Settings" aria-label="Settings"><span class="ico">⚙️</span></button>
        <button class="btab" data-page="Logging" aria-label="Logging"><span class="ico">＋</span></button>
        <button class="btab" data-page="Progress" aria-label="Progress"><span class="ico">⚡</span></button>
        <button class="btab" data-page="Info" aria-label="Info hub"><span class="ico">📖</span></button>
      </div>
    </div>
  </div>

  <!-- End day options modal -->
  <div class="modalBack" id="endBack">
    <div class="modal">
      <div class="modalTop">
        <div class="mtitle">Leftover calories</div>
        <button class="closeBtn" id="endClose">Close</button>
      </div>
      <div class="note" id="endNote"></div>
      <div class="spacer"></div>
      <div class="stack">
        <button class="btn" id="optRollover">Rollover calories</button>
        <button class="btn ghost" id="optBanked">Banked calories</button>
        <button class="btn ghost" id="optMoveOn">Move on</button>
      </div>
    </div>
  </div>

  <!-- Use banked modal -->
  <div class="modalBack" id="useBack">
    <div class="modal">
      <div class="modalTop">
        <div class="mtitle">Use banked calories</div>
        <button class="closeBtn" id="useClose">Close</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="useAmount">Amount</label>
          <input id="useAmount" type="number" inputmode="numeric" min="0" />
        </div>
        <div class="field small">
          <button class="btn" id="useApplyBtn">Use</button>
        </div>
      </div>
      <div class="note" id="useHint"></div>
    </div>
  </div>

  <!-- Edit saved day modal -->
  <div class="modalBack" id="editBack">
    <div class="modal">
      <div class="modalTop">
        <div class="mtitle" id="editTitle">Edit day</div>
        <button class="closeBtn" id="editClose">Close</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="editYTdee">TDEE</label>
          <input id="editYTdee" type="number" inputmode="numeric" min="0" />
        </div>
        <div class="field">
          <label for="editIntake">Intake</label>
          <input id="editIntake" type="number" inputmode="numeric" min="0" />
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="editSave">Save</button>
    </div>
  </div>

  <script>
    const LS_SETTINGS = "allocate_settings_v5";
    const LS_STATS = "allocate_stats_v5";
    const LS_TODAY = "allocate_today_v5";
    const LS_DAYS = "allocate_days_v5";
    const LS_BANKS = "allocate_banks_v5";

    const DEFAULT_DEFICIT = 750;
    const DAY_CUTOFF_HOUR = 3;

    const el = (id) => document.getElementById(id);

    const fmt = (n) => {
      const x = Number.isFinite(n) ? Math.round(n) : 0;
      return x.toLocaleString("en-GB");
    };

    const loadJSON = (key, fallback) => {
      try{
        const raw = localStorage.getItem(key);
        if(!raw) return fallback;
        return JSON.parse(raw);
      }catch{
        return fallback;
      }
    };

    const saveJSON = (key, value) => {
      localStorage.setItem(key, JSON.stringify(value));
    };

    const pad2 = (n) => String(n).padStart(2, "0");

    const dayKeyWithCutoff = (date = new Date()) => {
      const d = new Date(date);
      if(d.getHours() < DAY_CUTOFF_HOUR){
        d.setDate(d.getDate() - 1);
      }
      const yyyy = d.getFullYear();
      const mm = pad2(d.getMonth() + 1);
      const dd = pad2(d.getDate());
      return `${yyyy}-${mm}-${dd}`;
    };

    const timeHHMM = (date = new Date()) => `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;

    const getSettings = () => {
      const s = loadJSON(LS_SETTINGS, null);
      if(!s || typeof s.deficit !== "number"){
        return { deficit: DEFAULT_DEFICIT };
      }
      return { deficit: Math.max(0, Math.round(s.deficit)) };
    };

    const setSettings = (settings) => saveJSON(LS_SETTINGS, settings);

    const getStats = () => loadJSON(LS_STATS, { heightCm:"", weightLb:"", age:"", gender:"" });
    const setStats = (stats) => saveJSON(LS_STATS, stats);

    const getBanks = () => {
      const b = loadJSON(LS_BANKS, null);
      if(!b) return { rolloverPending: 0, banked: 0 };
      return {
        rolloverPending: Math.max(0, Math.round(Number(b.rolloverPending || 0))),
        banked: Math.max(0, Math.round(Number(b.banked || 0)))
      };
    };
    const setBanks = (banks) => saveJSON(LS_BANKS, banks);

    const defaultToday = () => ({
      dayKey: dayKeyWithCutoff(),
      yTdee: 0,
      maintenance: false,
      entries: [],
      rolloverApplied: 0,
      usedBanked: 0
    });

    const getToday = () => {
      const t = loadJSON(LS_TODAY, null);
      if(!t || !t.dayKey) return defaultToday();
      if(!Array.isArray(t.entries)) t.entries = [];
      if(typeof t.rolloverApplied !== "number") t.rolloverApplied = 0;
      if(typeof t.usedBanked !== "number") t.usedBanked = 0;
      return t;
    };

    const setToday = (today) => saveJSON(LS_TODAY, today);

    const getDays = () => {
      const arr = loadJSON(LS_DAYS, []);
      return Array.isArray(arr) ? arr : [];
    };

    const setDays = (arr) => saveJSON(LS_DAYS, arr);

    const sumIntake = (entries) => entries.reduce((a,e) => a + (Number(e.cals)||0), 0);

    const calcBudgetBase = (today, settings) => {
      const t = Math.max(0, Number(today.yTdee || 0));
      if(today.maintenance) return Math.round(t);
      return Math.max(0, Math.round(t - settings.deficit));
    };

    const calcBudgetTotal = (today, settings) => {
      const base = calcBudgetBase(today, settings);
      return Math.round(base + (today.rolloverApplied || 0) + (today.usedBanked || 0));
    };

    const ensureDayRoll = () => {
      const settings = getSettings(); // eslint-disable-line no-unused-vars
      const banks = getBanks();
      const today = getToday();

      const keyNow = dayKeyWithCutoff();
      if(today.dayKey === keyNow) return;

      const next = defaultToday();
      next.dayKey = keyNow;

      next.rolloverApplied = Math.round(banks.rolloverPending || 0);
      banks.rolloverPending = 0;
      setBanks(banks);

      setToday(next);
    };

    const setActivePage = (name) => {
      ["Dash","Settings","Logging","Progress","Info"].forEach((p) => {
        el(`page${p}`).classList.toggle("active", p === name);
      });
      document.querySelectorAll(".btab").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-page") === name);
      });
    };

    document.querySelectorAll(".btab").forEach((b) => {
      b.addEventListener("click", () => setActivePage(b.getAttribute("data-page")));
    });

    const renderEntries = (today) => {
      const list = el("entryList");
      list.innerHTML = "";

      const entries = today.entries.slice().sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

      for(const e of entries){
        const li = document.createElement("li");
        li.className = "entry";
        li.innerHTML = `
          <div class="left">
            <div class="time">${e.time || ""}</div>
            <div class="cals">${fmt(Number(e.cals)||0)}</div>
          </div>
          <button class="xbtn" data-x="${e.id}">X</button>
        `;
        list.appendChild(li);
      }

      list.querySelectorAll("[data-x]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ensureDayRoll();
          const today = getToday();
          const id = btn.getAttribute("data-x");
          today.entries = today.entries.filter(x => String(x.id) !== String(id));
          setToday(today);
          render();
        });
      });
    };

    const renderProgress = () => {
      const settings = getSettings();
      const stack = el("progressStack");
      stack.innerHTML = "";

      const days = getDays().slice().sort((a,b) => (a.dayKey < b.dayKey ? 1 : -1));

      if(days.length === 0){
        const c = document.createElement("div");
        c.className = "card";
        c.innerHTML = `<div style="font-weight:900; font-size:16px;">No days saved yet</div>`;
        stack.appendChild(c);
        return;
      }

      for(const d of days){
        const deficit = d.maintenance ? 0 : settings.deficit;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;">
            <div style="font-weight:900; font-size:14px; color: rgba(27,16,32,.75);">${d.dayKey}</div>
            <div style="display:flex; gap:8px;">
              <button class="smBtn" data-edit="${d.id}">Edit</button>
              <button class="smBtn" data-delday="${d.id}">Delete</button>
            </div>
          </div>

          <div class="grid2">
            <div class="kpi">
              <div class="klabel">TDEE</div>
              <div class="kval">${fmt(Number(d.yTdee||0))}</div>
            </div>
            <div class="kpi">
              <div class="klabel">Budget</div>
              <div class="kval">${fmt(Number(d.budget||0))}</div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="grid2">
            <div class="kpi">
              <div class="klabel">Intake</div>
              <div class="kval">${fmt(Number(d.intake||0))}</div>
            </div>
            <div class="kpi">
              <div class="klabel">Deficit</div>
              <div class="kval">${d.maintenance ? "0" : `-${fmt(deficit)}`}</div>
            </div>
          </div>
        `;

        stack.appendChild(card);
      }

      stack.querySelectorAll("[data-delday]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-delday");
          const next = getDays().filter(x => String(x.id) !== String(id));
          setDays(next);
          render();
        });
      });

      stack.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => openEdit(btn.getAttribute("data-edit")));
      });
    };

    const renderStatsView = () => {
      const s = getStats();
      el("svHeight").textContent = s.heightCm ? `${s.heightCm} cm` : "-";
      el("svWeight").textContent = s.weightLb ? `${s.weightLb} lb` : "-";
      el("svAge").textContent = s.age ? String(s.age) : "-";
      const g = s.gender || "";
      el("svGender").textContent = g ? (g === "na" ? "N/A" : (g.charAt(0).toUpperCase() + g.slice(1))) : "-";
    };

    const openStatsEdit = () => {
      const s = getStats();
      el("heightInput").value = s.heightCm || "";
      el("weightStatInput").value = s.weightLb || "";
      el("ageInput").value = s.age || "";
      el("genderInput").value = s.gender || "";

      el("statsView").style.display = "none";
      el("statsEdit").style.display = "block";
      el("statsSavedHint").style.display = "none";
    };

    const closeStatsEdit = () => {
      el("statsEdit").style.display = "none";
      el("statsView").style.display = "block";
    };

    const setSavedButton = (buttonEl, savedText = "Saved") => {
      buttonEl.textContent = savedText;
      buttonEl.classList.add("saved");
      buttonEl.classList.remove("ghost");
    };

    const setUnsavedButton = (buttonEl, text = "Save", makeGhost = true) => {
      buttonEl.textContent = text;
      buttonEl.classList.remove("saved");
      if(makeGhost) buttonEl.classList.add("ghost");
    };

    const render = () => {
      ensureDayRoll();

      const settings = getSettings();
      const banks = getBanks();
      const today = getToday();

      const budgetBase = calcBudgetBase(today, settings);
      const budgetTotal = calcBudgetTotal(today, settings);
      const intake = sumIntake(today.entries);
      const left = Math.round(budgetTotal - intake);

      el("budgetBig").textContent = fmt(budgetTotal);
      el("yTdeeKpi").textContent = fmt(today.yTdee || 0);
      el("deficitKpi").textContent = today.maintenance ? "0" : `-${fmt(settings.deficit)}`;

      el("rolloverKpi").textContent = fmt(today.rolloverApplied || 0);
      el("bankedKpi").textContent = fmt(banks.banked || 0);

      el("tdeeInputDash").value = today.yTdee ? String(today.yTdee) : "";
      el("maintenanceToggleDash").checked = !!today.maintenance;

      el("modeHint").textContent = today.maintenance ? "Maintenance" : "Deficit";
      el("savedHint").textContent = "Saved";

      el("leftBig").textContent = fmt(left);
      el("intakeKpi").textContent = fmt(intake);
      el("budgetLogKpi").textContent = fmt(budgetTotal);

      el("deficitInput").value = String(settings.deficit);

      renderEntries(today);
      renderProgress();
      renderStatsView();

      setToday(today);
    };

    el("applyDashBtn").addEventListener("click", () => {
      ensureDayRoll();
      const today = getToday();
      const v = Number(el("tdeeInputDash").value || 0);
      today.yTdee = Number.isFinite(v) ? Math.round(v) : 0;
      today.maintenance = !!el("maintenanceToggleDash").checked;
      setToday(today);
      render();
    });

    el("maintenanceToggleDash").addEventListener("change", () => {
      ensureDayRoll();
      const today = getToday();
      today.maintenance = !!el("maintenanceToggleDash").checked;
      setToday(today);
      render();
    });

    el("addBtn").addEventListener("click", () => {
      ensureDayRoll();
      const today = getToday();
      const v = Number(el("addInput").value || 0);
      if(!Number.isFinite(v) || v <= 0) return;

      const entry = {
        id: `${today.dayKey}_${Date.now()}`,
        time: timeHHMM(new Date()),
        cals: Math.round(v),
        createdAt: Date.now()
      };

      today.entries.push(entry);
      setToday(today);

      el("addInput").value = "";
      render();
    });

    el("addInput").addEventListener("keydown", (e) => {
      if(e.key === "Enter") el("addBtn").click();
    });

    el("undoBtn").addEventListener("click", () => {
      ensureDayRoll();
      const today = getToday();
      if(!today.entries.length) return;
      today.entries.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
      today.entries.pop();
      setToday(today);
      render();
    });

    const saveDayToProgress = () => {
      ensureDayRoll();
      const settings = getSettings();
      const today = getToday();

      const intake = sumIntake(today.entries);
      const budgetTotal = calcBudgetTotal(today, settings);

      const dayObj = {
        id: `day_${today.dayKey}`,
        dayKey: today.dayKey,
        yTdee: Math.round(today.yTdee || 0),
        maintenance: !!today.maintenance,
        budget: Math.round(budgetTotal),
        intake: Math.round(intake)
      };

      const days = getDays();
      const idx = days.findIndex(x => x.dayKey === dayObj.dayKey);
      if(idx >= 0) days[idx] = dayObj;
      else days.push(dayObj);
      setDays(days);

      return { left: Math.round(budgetTotal - intake) };
    };

    const openEndOptions = (left) => {
      el("endNote").textContent = `${fmt(left)} calories left.`;
      el("endBack").classList.add("show");
    };
    const closeEndOptions = () => el("endBack").classList.remove("show");

    el("endClose").addEventListener("click", closeEndOptions);
    el("endBack").addEventListener("click", (e) => {
      if(e.target === el("endBack")) closeEndOptions();
    });

    const finishEndDay = () => {
      const today = getToday();
      const next = defaultToday();
      next.dayKey = dayKeyWithCutoff(new Date());
      setToday(next);
      render();
      setActivePage("Progress");
    };

    el("endDayBtn").addEventListener("click", () => {
      const res = saveDayToProgress();
      if(res.left > 0){
        openEndOptions(res.left);
      }else{
        finishEndDay();
      }
    });

    el("optRollover").addEventListener("click", () => {
      ensureDayRoll();
      const settings = getSettings();
      const today = getToday();
      const banks = getBanks();

      const intake = sumIntake(today.entries);
      const budgetTotal = calcBudgetTotal(today, settings);
      const left = Math.round(budgetTotal - intake);

      banks.rolloverPending = Math.round(left);
      setBanks(banks);

      closeEndOptions();
      finishEndDay();
    });

    el("optBanked").addEventListener("click", () => {
      ensureDayRoll();
      const settings = getSettings();
      const today = getToday();
      const banks = getBanks();

      const intake = sumIntake(today.entries);
      const budgetTotal = calcBudgetTotal(today, settings);
      const left = Math.round(budgetTotal - intake);

      banks.banked = Math.round((banks.banked || 0) + left);
      banks.rolloverPending = 0;
      setBanks(banks);

      closeEndOptions();
      finishEndDay();
    });

    el("optMoveOn").addEventListener("click", () => {
      const banks = getBanks();
      banks.rolloverPending = 0;
      setBanks(banks);

      closeEndOptions();
      finishEndDay();
    });

    el("saveSettingsBtn").addEventListener("click", () => {
      const v = Number(el("deficitInput").value || 0);
      const deficit = (Number.isFinite(v) && v >= 0) ? Math.round(v) : DEFAULT_DEFICIT;
      setSettings({ deficit });

      const btn = el("saveSettingsBtn");
      setSavedButton(btn, "Saved");
      setTimeout(() => setUnsavedButton(btn, "Save", false), 1200);

      render();
    });

    el("deficitInput").addEventListener("input", () => {
      setUnsavedButton(el("saveSettingsBtn"), "Save", false);
    });

    el("editStatsBtn").addEventListener("click", () => {
      const isEditing = el("statsEdit").style.display !== "none";
      if(isEditing){
        closeStatsEdit();
      }else{
        openStatsEdit();
      }
    });

    el("applyStatsBtn").addEventListener("click", () => {
      const stats = {
        heightCm: el("heightInput").value || "",
        weightLb: el("weightStatInput").value || "",
        age: el("ageInput").value || "",
        gender: el("genderInput").value || ""
      };
      setStats(stats);

      renderStatsView();
      closeStatsEdit();

      el("statsSavedHint").style.display = "block";
      setTimeout(() => { el("statsSavedHint").style.display = "none"; }, 1000);
    });

    // Use banked
    const openUseModal = () => {
      const banks = getBanks();
      const max = Math.round(banks.banked || 0);
      el("useAmount").value = "";
      el("useHint").textContent = max > 0 ? `${fmt(max)} available.` : "0 available.";
      el("useBack").classList.add("show");
    };
    const closeUseModal = () => el("useBack").classList.remove("show");

    el("useBankedBtn").addEventListener("click", () => openUseModal());
    el("useClose").addEventListener("click", closeUseModal);
    el("useBack").addEventListener("click", (e) => {
      if(e.target === el("useBack")) closeUseModal();
    });

    el("useApplyBtn").addEventListener("click", () => {
      ensureDayRoll();
      const banks = getBanks();
      const today = getToday();

      const max = Math.round(banks.banked || 0);
      const v = Number(el("useAmount").value || 0);
      if(!Number.isFinite(v) || v <= 0) return;

      const amt = Math.min(max, Math.round(v));
      if(amt <= 0) return;

      banks.banked = Math.max(0, Math.round(max - amt));
      setBanks(banks);

      today.usedBanked = Math.round((today.usedBanked || 0) + amt);
      setToday(today);

      closeUseModal();
      render();
    });

    // Export
    el("exportBtn").addEventListener("click", () => {
      const payload = {
        exportedAt: new Date().toISOString(),
        cutoffHour: DAY_CUTOFF_HOUR,
        settings: getSettings(),
        stats: getStats(),
        banks: getBanks(),
        today: getToday(),
        days: getDays()
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `allocate_export_${dayKeyWithCutoff()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // Edit saved day modal
    let editingId = null;

    const openEdit = (id) => {
      const days = getDays();
      const d = days.find(x => String(x.id) === String(id));
      if(!d) return;

      editingId = id;
      el("editTitle").textContent = `Edit ${d.dayKey}`;
      el("editYTdee").value = String(d.yTdee || 0);
      el("editIntake").value = String(d.intake || 0);
      el("editBack").classList.add("show");
    };

    const closeEdit = () => {
      editingId = null;
      el("editBack").classList.remove("show");
    };

    el("editClose").addEventListener("click", closeEdit);
    el("editBack").addEventListener("click", (e) => {
      if(e.target === el("editBack")) closeEdit();
    });

    el("editSave").addEventListener("click", () => {
      if(!editingId) return;

      const days = getDays();
      const idx = days.findIndex(x => String(x.id) === String(editingId));
      if(idx < 0) return;

      const y = Number(el("editYTdee").value || 0);
      const i = Number(el("editIntake").value || 0);

      days[idx].yTdee = Number.isFinite(y) ? Math.max(0, Math.round(y)) : 0;
      days[idx].intake = Number.isFinite(i) ? Math.max(0, Math.round(i)) : 0;

      const settings = getSettings();
      const tdee = days[idx].yTdee || 0;
      const budget = days[idx].maintenance ? tdee : Math.max(0, Math.round(tdee - settings.deficit));
      days[idx].budget = budget;

      setDays(days);
      closeEdit();
      render();
    });

    // Keep day rollover accurate
    setInterval(() => {
      const keyNow = dayKeyWithCutoff();
      const today = getToday();
      if(today.dayKey !== keyNow){
        ensureDayRoll();
        render();
      }
    }, 60000);

    // Init
    renderStatsView();
    render();
  </script>
</body>
</html>
